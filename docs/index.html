<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SolarEdge Production Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 16px;
    background: #f7f7f7;
}

h1 {
    margin: 0 0 12px;
    font-size: 1.2rem;
}

h2 {
    margin: 0 0 8px;
    font-size: 0.9rem;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.full {
    grid-column: 1 / -1;
}

.card {
    background: white;
    padding: 12px;
    border-radius: 8px;
}

canvas {
    max-width: 100%;
    max-height: 200px;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
}

th, td {
    padding: 4px 6px;
    border-bottom: 1px solid #ddd;
    text-align: right;
}

th:first-child,
td:first-child {
    text-align: left;
}

.positive {
    color: green;
    font-weight: bold;
}

.negative {
    color: red;
    font-weight: bold;
}

.alert {
    color: red;
    font-size: 0.85rem;
}
</style>
</head>

<body>

<h1>SolarEdge Production Monitor</h1>

<div class="grid">

    <div class="card full">
        <div id="summary"></div>
    </div>

    <div class="card">
        <h2>Last 7 Days</h2>
        <canvas id="weekChart"></canvas>
        <p id="weekEmpty" style="display:none; color:#666;">No daily data yet.</p>
    </div>

    <div class="card">
        <h2>Year-over-Year Monthly Production</h2>
        <canvas id="yearChart"></canvas>
    </div>

    <div class="card">
        <h2>Average Monthly Production</h2>
        <canvas id="monthlyAverageChart"></canvas>
    </div>

    <div class="card">
        <h2>Current Year vs Expected</h2>
        <table id="currentYearTable">
            <thead>
                <tr>
                    <th>Month</th>
                    <th>Actual kWh</th>
                    <th>Average kWh</th>
                    <th>Performance</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="card">
        <h2>Annual Performance</h2>
        <table id="annualTable">
            <thead>
                <tr>
                    <th>Year</th>
                    <th>kWh</th>
                    <th>kWh/kWp</th>
                    <th>vs Average</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="card">
        <h2>Alerts</h2>
        <div id="alerts"></div>
    </div>

</div>


<script>

// Validated categorical palette (see dataviz color-formula) — fixed hue
// order, distinguishable under color-vision deficiency simulation.
const CATEGORICAL_COLORS = [
    "#2a78d6", // blue
    "#eb6834", // orange
    "#1baf7a", // aqua
    "#eda100", // yellow
    "#e87ba4", // magenta
    "#008300", // green
    "#4a3aa7", // violet
    "#e34948", // red
];

const monthNames = [
    "",
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"
];


fetch("dashboard.json")
.then(response => response.json())
.then(data => {

    renderSummary(data);
    renderWeekChart(data.week);
    renderYearChart(data);
    renderAnalytics(data.analytics);
    renderAlerts(data.anomalies);

});


function renderWeekChart(week) {

    const canvas = document.getElementById("weekChart");

    if (!week || week.length === 0) {
        canvas.style.display = "none";
        document.getElementById("weekEmpty").style.display = "block";
        return;
    }

    new Chart(
        canvas,
        {
            type: "bar",
            data: {
                labels: week.map(d => d.date),
                datasets: [{
                    label: "kWh",
                    data: week.map(d => d.energy_kwh),
                    backgroundColor: CATEGORICAL_COLORS[0]
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }
                }
            }
        }
    );
}


function renderSummary(data) {

    document.getElementById("summary").innerHTML = `
        <b>Records collected:</b> ${data.count}<br>
        <b>Years:</b> ${Object.keys(data.annual).join(", ")}
    `;
}


function renderYearChart(data) {

    const years = Object.keys(data.monthly)
        .sort();

    const datasets = years.map((year, i) => {

        const values = [];

        for (let m = 1; m <= 12; m++) {
            values.push(
                data.monthly[year][
                    String(m).padStart(2,"0")
                ] || null
            );
        }

        // Cycle the fixed hue order; once it repeats, dash the
        // line so reused hues stay distinguishable at a glance.
        const color = CATEGORICAL_COLORS[i % CATEGORICAL_COLORS.length];

        return {
            label: year,
            data: values,
            tension: 0.2,
            borderColor: color,
            backgroundColor: color,
            borderDash: i >= CATEGORICAL_COLORS.length ? [6, 4] : []
        };

    });


    new Chart(
        document.getElementById("yearChart"),
        {
            type: "line",
            data: {
                labels: monthNames.slice(1),
                datasets
            },
            options: {
                responsive: true,
                interaction: {
                    mode: "index",
                    intersect: false
                }
            }
        }
    );
}


function renderAnalytics(analytics) {

    renderMonthlyAverage(
        analytics.monthly_average
    );

    renderCurrentYear(
        analytics.current_year_vs_average
    );

    renderAnnual(
        analytics.annual_summary
    );

}


function renderMonthlyAverage(avg) {

    new Chart(
        document.getElementById(
            "monthlyAverageChart"
        ),
        {
            type: "bar",
            data: {
                labels: Array.from(
                    {length: 12},
                    (_, i) => monthNames[i + 1]
                ),

                datasets: [{
                    label: "Average kWh",

                    data: Array.from(
                        {length: 12},
                        (_, i) =>
                            avg[
                              String(i + 1)
                              .padStart(2,"0")
                            ] || 0
                    )
                }]
            }
        }
    );
}


function renderCurrentYear(rows) {

    const tbody =
        document.querySelector(
            "#currentYearTable tbody"
        );

    tbody.innerHTML = "";

    Object.entries(rows)
    .sort()
    .forEach(([month, value]) => {

        const positive =
            value.deviation_pct >= 0;

        tbody.innerHTML += `
        <tr>
            <td>
                ${monthNames[
                    Number(month)
                ]}
            </td>

            <td>
                ${value.actual}
            </td>

            <td>
                ${value.average}
            </td>

            <td class="${
                positive
                ? "positive"
                : "negative"
            }">

                ${
                    positive ? "+" : ""
                }${value.deviation_pct}%

            </td>
        </tr>
        `;
    });
}


function renderAnnual(rows) {

    const tbody =
        document.querySelector(
            "#annualTable tbody"
        );

    tbody.innerHTML = "";

    Object.entries(rows)
    .sort()
    .forEach(([year,value]) => {

        const positive =
            value.vs_average_pct >= 0;

        tbody.innerHTML += `
        <tr>
            <td>
                ${year}
            </td>

            <td>
                ${value.energy_kwh}
            </td>

            <td>
                ${value.specific_yield}
            </td>

            <td class="${
                positive
                ? "positive"
                : "negative"
            }">

                ${
                    positive ? "+" : ""
                }${value.vs_average_pct}%

            </td>
        </tr>
        `;
    });
}


function renderAlerts(alerts) {

    const div =
        document.getElementById(
            "alerts"
        );

    if (!alerts || alerts.length === 0) {
        div.innerHTML =
            "No anomalies detected.";
        return;
    }

    div.innerHTML =
        alerts.map(a => `
            <div class="alert">
            ${monthNames[
                Number(a.month)
            ]}:
            ${a.actual} kWh
            vs average
            ${a.average} kWh
            </div>
        `).join("");

}

</script>

</body>
</html>
